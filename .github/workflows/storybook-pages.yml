# Publishes the example Storybook to GitHub Pages on every push to main.
# What works there: every story, the Accessibility tab (axe and our rule run
# in the viewer's browser), the Overview and Decisions pages. What does not:
# the Run tests button (needs Vitest on a server) and the edit gate (lives in
# Claude Code) — those are shown live or as a recording.
#
# One-time setup in the repository: Settings → Pages → Source: GitHub Actions.

name: Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci
        working-directory: example
      - run: npx storybook build --quiet -o storybook-static
        working-directory: example
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
